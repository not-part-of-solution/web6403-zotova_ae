    <main>
        <section class = "login_intro">
            <form class="auth-form" id="auth-form" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="login">Логин</label>
                    <input class="auth-input" type="text" id="login" name="login"
                           placeholder="manul_lover" required>
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="password">Пароль</label>
                    <input class="auth-input" type="password" id="password" name="password"
                           placeholder="••••••••" required>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="email">Email</label>
                    <input class="auth-input" type="email" id="email" name="email"
                           placeholder="manul@example.com" required>
                </div>

                <div class="auth-field auth-field--checkbox">
                    <input class="auth-checkbox" type="checkbox" id="agreement" name="agreement" required>
                    <label class="auth-checkbox-label" for="agreement">
                        Согласен на обработку персональных данных
                    </label>
                </div>

                <button class="auth-submit" type="submit">Стать манулом</button>
                <p class="auth-msg" id="form-msg" hidden></p>
            </form>
        </section>
    </main>
